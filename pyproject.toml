[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "news-article-analyst"
version = "0.1.0"
description = "Herramienta de análisis periodístico de artículos usando LangChain y LlamaFarm."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langchain>=0.2.7,<0.3.0",
  "langchain-core>=0.2.7,<0.3.0",
  "langchain-community>=0.2.7,<0.3.0",
  "pydantic>=2.7,<3.0",
  "requests>=2.31,<3.0",
  "trafilatura>=1.6,<2.0",
  "beautifulsoup4>=4.12,<5.0",
  "langdetect>=1.0.9,<2.0",
  "python-dotenv>=1.0,<2.0",
  "tenacity>=8.3,<9.0",
  "fastapi>=0.111,<0.120",
  "uvicorn[standard]>=0.24,<0.30",
  "jinja2>=3.1,<4.0",
  "python-multipart>=0.0.7,<0.1",
  "markdown>=3.4,<4.0"
]

[project.scripts]
article-analyst = "article_analyst.cli:app"

[tool.setuptools.packages.find]
include = ["article_analyst"]
exclude = ["outputs", "outputs.*"]
